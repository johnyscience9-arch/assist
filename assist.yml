<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice AI Assistant - All in One</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-between p-4">

    <!-- Header -->
    <header class="w-full max-w-2xl text-center py-6">
        <h1 class="text-3xl font-extrabold tracking-tight bg-gradient-to-r from-cyan-400 to-indigo-500 bg-clip-text text-transparent">
            Voice AI Assistant
        </h1>
        <p class="text-slate-400 text-sm mt-1">Speak or type to interact with your personal AI.</p>
    </header>

    <!-- Chat / Transcript Container -->
    <main id="chat-container" class="w-full max-w-2xl flex-1 bg-slate-900/60 border border-slate-800 rounded-2xl p-4 overflow-y-auto mb-4 space-y-4 max-h-[50vh] shadow-inner">
        <div class="flex items-start space-x-3">
            <div class="bg-indigo-600 text-white rounded-full h-8 w-8 flex items-center justify-center font-bold text-sm shrink-0">AI</div>
            <div class="bg-slate-800 p-3 rounded-2xl text-sm max-w-[80%] text-slate-200">
                Hello! Tap the microphone button or type below to start talking.
            </div>
        </div>
    </main>

    <!-- Visualizer & Controls -->
    <div class="w-full max-w-2xl flex flex-col items-center space-y-4">
        
        <!-- Voice Waveform Animation -->
        <div id="waveform" class="flex items-center space-x-1 h-8 opacity-0 transition-opacity duration-300">
            <span class="w-1 bg-cyan-400 animate-pulse h-4 rounded-full"></span>
            <span class="w-1 bg-cyan-400 animate-pulse h-8 rounded-full delay-75"></span>
            <span class="w-1 bg-cyan-400 animate-pulse h-6 rounded-full delay-150"></span>
            <span class="w-1 bg-cyan-400 animate-pulse h-3 rounded-full delay-200"></span>
            <span class="w-1 bg-cyan-400 animate-pulse h-7 rounded-full delay-300"></span>
        </div>

        <!-- Input Bar -->
        <div class="flex items-center w-full bg-slate-900 border border-slate-800 rounded-full p-2 shadow-lg">
            <input type="text" id="user-input" placeholder="Type a message or click mic..." 
                class="flex-1 bg-transparent px-4 py-2 text-sm focus:outline-none text-slate-100 placeholder-slate-500">
            
            <!-- Microphone Button -->
            <button id="mic-btn" title="Click to Speak" class="bg-slate-800 hover:bg-slate-700 text-cyan-400 p-3 rounded-full transition-all duration-200 focus:outline-none">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
                </svg>
            </button>

            <!-- Send Button -->
            <button id="send-btn" class="bg-indigo-600 hover:bg-indigo-500 text-white p-3 rounded-full ml-2 transition-all duration-200 focus:outline-none">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                </svg>
            </button>
        </div>
    </div>

    <!-- Footer -->
    <footer class="w-full text-center text-xs text-slate-500 py-4">
        Built with Pure HTML, Tailwind CSS & JavaScript
    </footer>

    <!-- Client-side Script -->
    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const micBtn = document.getElementById('mic-btn');
        const waveform = document.getElementById('waveform');

        let isListening = false;
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            recognition.onstart = () => {
                isListening = true;
                waveform.classList.remove('opacity-0');
                micBtn.classList.add('bg-cyan-600', 'text-white');
            };

            recognition.onresult = (event) => {
                const speechToText = event.results[0][0].transcript;
                userInput.value = speechToText;
                handleUserMessage(speechToText);
            };

            recognition.onerror = (event) => {
                console.error('Speech recognition error', event.error);
                stopListening();
            };

            recognition.onend = () => {
                stopListening();
            };
        } else {
            micBtn.style.display = 'none';
        }

        function stopListening() {
            isListening = false;
            waveform.classList.add('opacity-0');
            micBtn.classList.remove('bg-cyan-600', 'text-white');
        }

        micBtn.addEventListener('click', () => {
            if (!recognition) return;
            if (isListening) {
                recognition.stop();
                stopListening();
            } else {
                recognition.start();
            }
        });

        sendBtn.addEventListener('click', () => {
            const message = userInput.value.trim();
            if (message) {
                handleUserMessage(message);
                userInput.value = '';
            }
        });

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendBtn.click();
            }
        });

        function handleUserMessage(message) {
            appendMessage(message, 'user');
            const loadingId = appendMessage('Thinking...', 'ai', true);

            // Simulate AI response locally (or you can connect fetch API here)
            setTimeout(() => {
                removeMessage(loadingId);
                const aiReply = `I received your message: "${message}". How can I help you further?`;
                appendMessage(aiReply, 'ai');
                speakText(aiReply);
            }, 1000);
        }

        function appendMessage(text, sender, isLoading = false) {
            const id = 'msg-' + Date.now();
            const isUser = sender === 'user';
            
            const messageHTML = `
                <div id="${id}" class="flex items-start space-x-3 ${isUser ? 'justify-end' : ''}">
                    ${!isUser ? '<div class="bg-indigo-600 text-white rounded-full h-8 w-8 flex items-center justify-center font-bold text-sm shrink-0">AI</div>' : ''}
                    <div class="${isUser ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-200'} p-3 rounded-2xl text-sm max-w-[80%] ${isLoading ? 'animate-pulse' : ''}">
                        ${text}
                    </div>
                    ${isUser ? '<div class="bg-cyan-600 text-white rounded-full h-8 w-8 flex items-center justify-center font-bold text-sm shrink-0">You</div>' : ''}
                </div>
            `;
            chatContainer.insertAdjacentHTML('beforeend', messageHTML);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return id;
        }

        function removeMessage(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 1.0;
                utterance.pitch = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }
    </script>
</body>
</html>
